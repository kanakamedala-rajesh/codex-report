name: Stage npm release
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  stage:
    name: Verify and stage the stable release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned publishing tools
        run: npm install --global npm@11.19.1 pnpm@10.11.0 --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --no-audit --no-fund
      - name: Verify project
        run: pnpm run verify
      - name: Check release version
        run: node tools/check-release-version.cjs "$GITHUB_REF_NAME"
      - name: Stage package for maintainer approval
        run: npm stage publish --access public --provenance --tag latest
