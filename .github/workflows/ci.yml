name: Quality and packed runtime
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
        node: ['18.20.8', '22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global pnpm@10.11.0 --ignore-scripts --no-audit --no-fund
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run verify
      - run: pnpm run audit:dependencies
      - run: pnpm run pack:local
      - name: Check the older-runtime database explicitly
        if: matrix.node == '18.20.8'
        run: node dist/cli.js self-test
        env:
          CODEX_REPORT_SQLITE_BACKEND: libsql

  browser:
    name: Live dashboard browser test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.11.0 --ignore-scripts --no-audit --no-fund
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # System dependencies are installed only in this disposable CI runner.
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm run test:browser
